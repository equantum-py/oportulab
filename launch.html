<!doctype html>
<html lang="es-PY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f63">
<title>OportuLab</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#0b2f63}
main{min-height:100dvh;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.card{width:min(100%,430px);min-height:min(720px,calc(100dvh - 40px));background:#fff;border:1px solid #e1e8f1;border-radius:28px;box-shadow:0 20px 60px rgba(11,47,99,.12);padding:24px;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-size:10px;font-weight:800;letter-spacing:.12em;color:#74839a}
.brand{flex:1;display:grid;place-items:center;text-align:center;padding:24px 0}.brand img{width:min(82%,300px);height:auto;display:block}.brand p{margin:16px 0 0;color:#63738a;font-size:14px}
.actions{display:grid;gap:10px}.btn{min-height:54px;border-radius:14px;border:0;font:inherit;font-weight:800;cursor:pointer}.primary{background:#0b2f63;color:#fff}.secondary{background:#eef4fb;color:#0b2f63;text-decoration:none;display:grid;place-items:center}.note{text-align:center;color:#7b8799;font-size:12px;line-height:1.4;margin:4px 0 0}
@media(max-width:480px){main{padding:12px}.card{min-height:calc(100dvh - 24px);border-radius:22px;padding:20px}}
</style>
</head>
<body>
<main><section class="card">
<div class="top"><div>PATROCINADO POR<br><span style="letter-spacing:0;font-size:12px;color:#0b2f63">Cooperativa Vida y Luz Ltda.</span></div><div>DESARROLLADO POR<br><span style="letter-spacing:0;font-size:12px;color:#0b2f63">eQuantum</span></div></div>
<div class="brand"><div><img src="/icons/oportulab-logo.jpeg" alt="OportuLab"><p>Laboratorio de oportunidades</p></div></div>
<div class="actions"><button class="btn primary" id="install" type="button">Instalar App</button><a class="btn secondary" href="/app">Continuar en la web</a><p class="note" id="note">Accedé a OportuLab como una aplicación.</p></div>
</section></main>
<script>
let promptEvent=null;
const btn=document.getElementById('install'),note=document.getElementById('note');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;note.textContent='OportuLab está lista para instalarse.'});
btn.addEventListener('click',async()=>{if(promptEvent){await promptEvent.prompt();const r=await promptEvent.userChoice;if(r.outcome==='accepted')location.href='/app';promptEvent=null;return}note.textContent=/iphone|ipad|ipod/i.test(navigator.userAgent)?'En Safari: Compartir → Agregar a pantalla de inicio.':'En Chrome: menú ⋮ → Instalar app o Crear acceso directo.'});
</script>
</body></html>
