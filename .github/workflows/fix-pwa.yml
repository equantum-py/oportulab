name: Fix OportuLab PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-pwa:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PWA integration safely
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          head_block = '''\n  <link rel="manifest" href="/manifest.webmanifest">\n  <meta name="theme-color" content="#111827">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="default">\n  <meta name="apple-mobile-web-app-title" content="OportuLab">\n  <link rel="apple-touch-icon" href="/icons/icon-192.png">\n'''

          if 'href="/manifest.webmanifest"' not in html and "href='/manifest.webmanifest'" not in html:
              if '</head>' not in html:
                  raise SystemExit('No se encontró </head> en index.html')
              html = html.replace('</head>', head_block + '</head>', 1)

          if 'src="/pwa.js"' not in html and "src='/pwa.js'" not in html:
              if '</body>' not in html:
                  raise SystemExit('No se encontró </body> en index.html')
              html = html.replace('</body>', '  <script src="/pwa.js" defer></script>\n</body>', 1)

          if html != original:
              path.write_text(html, encoding='utf-8')

      - name: Ensure exact PWA icon dimensions
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          for size in (192, 512):
              p = Path(f'icons/icon-{size}.png')
              if not p.exists():
                  raise SystemExit(f'Falta {p}')
              with Image.open(p) as im:
                  if im.size != (size, size):
                      im = im.convert('RGBA').resize((size, size), Image.Resampling.LANCZOS)
                      im.save(p, 'PNG', optimize=True)
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "PWA already correct"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html icons/icon-192.png icons/icon-512.png
          git commit -m "fix: complete PWA installation support"
          git push origin main
